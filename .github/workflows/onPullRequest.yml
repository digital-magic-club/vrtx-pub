name: Pull request validations

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [ main ]

# Every check only looks at the dictionaries changed by the PR, so an issue
# already on main (or in another PR) doesn't make unrelated PRs fail.
# The PR is fetched as data only: its files are read through git, never executed.

jobs:
  autofix:
    name: Fix simple dictionary issues
    runs-on: macos-latest # Same locales as the sorting check
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      - name: Checkout Backend repository
        uses: actions/checkout@v3
        with:
          repository: digital-magic-club/vrtx-backend
          token: ${{ secrets.VRTX_CI_TOKEN }}
          ref: main
          path: backend

      - name: Checkout main branch
        uses: actions/checkout@v3
        with:
          ref: main
          path: main
          fetch-depth: 0
          persist-credentials: false # The fix is pushed with VRTX_CI_TOKEN instead

      - name: Fetch PR branch
        working-directory: main
        run: git fetch origin "+refs/pull/${{ github.event.pull_request.number }}/head:pr"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "$GITHUB_WORKSPACE/backend/functions/dictionaries/requirements.txt"

      - name: Fix dictionaries changed by the PR
        working-directory: main
        run: .github/scripts/autofix_pr_dictionaries.sh "$GITHUB_WORKSPACE/backend/functions/dictionaries" "$GITHUB_WORKSPACE/pr_tree"

      # The push triggers a new run of these validations on the fixed branch
      - name: Push fixes to the PR branch
        id: push
        working-directory: pr_tree
        env:
          TOKEN: ${{ secrets.VRTX_CI_TOKEN }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$(git rev-parse HEAD)" == "$(git rev-parse pr)" ]]; then
            echo "pushed=false" >> $GITHUB_OUTPUT
          elif git push "https://x-access-token:${TOKEN}@github.com/${HEAD_REPO}.git" "HEAD:refs/heads/${HEAD_REF}"; then
            echo "pushed=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::Couldn't push the fixes to ${HEAD_REPO}:${HEAD_REF}. Is \"Allow edits by maintainers\" enabled on the PR?"
            echo "pushed=false" >> $GITHUB_OUTPUT
          fi

  check-validated-dictionaries:
    name: Check validated dictionaries list is edited by an admin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v3
        with:
          ref: main
          path: main
          fetch-depth: 0

      - name: Fetch PR branch
        working-directory: main
        run: git fetch origin "+refs/pull/${{ github.event.pull_request.number }}/head:pr"

      - name: Check PR author permission
        working-directory: main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if git diff --quiet "$(git merge-base HEAD pr)" pr -- .github/validated_dictionaries.txt; then
            echo "✅ The validated dictionaries list isn't edited."
            exit 0
          fi

          PERMISSION=$(gh api "repos/${{ github.repository }}/collaborators/${AUTHOR}/permission" --jq .permission || echo none)
          if [[ "$PERMISSION" != "admin" ]]; then
            echo "❌ ERROR: .github/validated_dictionaries.txt can only be edited by a repo admin (${AUTHOR} is: ${PERMISSION})."
            exit 1
          fi
          echo "✅ The validated dictionaries list is edited by an admin (${AUTHOR})."

  check-incomplete-positions:
    name: Check for incomplete positions delta
    needs: autofix
    # Skipped when fixes were pushed, as the new run validates the fixed branch
    if: ${{ !cancelled() && needs.autofix.outputs.pushed != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Backend repository
        uses: actions/checkout@v3
        with:
          repository: digital-magic-club/vrtx-backend
          token: ${{ secrets.VRTX_CI_TOKEN }}
          ref: main
          path: backend

      - name: Checkout main branch
        uses: actions/checkout@v3
        with:
          ref: main
          path: main
          fetch-depth: 0

      - name: Fetch PR branch
        working-directory: main
        run: git fetch origin "+refs/pull/${{ github.event.pull_request.number }}/head:pr"

      # New dictionaries are skipped: compared against nothing, they would always fail
      - name: Stage dictionaries modified by the PR
        working-directory: main
        run: |
          .github/scripts/stage_pr_dictionaries.sh base "$GITHUB_WORKSPACE/base_changed" --modified-only
          .github/scripts/stage_pr_dictionaries.sh pr "$GITHUB_WORKSPACE/pr_changed" --modified-only

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "$GITHUB_WORKSPACE/backend/functions/dictionaries/requirements.txt"

      - name: Run validation script on base of changed dictionaries
        run: |
          python "$GITHUB_WORKSPACE/backend/functions/dictionaries/check_incomplete_positions.py" "$GITHUB_WORKSPACE/base_changed" > base_output.txt
          cat base_output.txt
          grep "Final total sum of incomplete positions" base_output.txt | awk '{print $NF}' > base_count.txt
          echo "BASE_COUNT=$(cat base_count.txt)" >> $GITHUB_ENV

      - name: Run validation script on PR changed dictionaries
        run: |
          python "$GITHUB_WORKSPACE/backend/functions/dictionaries/check_incomplete_positions.py" "$GITHUB_WORKSPACE/pr_changed" > pr_output.txt
          cat pr_output.txt
          grep "Final total sum of incomplete positions" pr_output.txt | awk '{print $NF}' > pr_count.txt
          echo "PR_COUNT=$(cat pr_count.txt)" >> $GITHUB_ENV

      - name: Compare Incomplete Positions
        run: |
          BASE_COUNT=${BASE_COUNT:-0}
          PR_COUNT=${PR_COUNT:-0}

          echo "Base incomplete positions in changed dictionaries: $BASE_COUNT"
          echo "PR incomplete positions in changed dictionaries: $PR_COUNT"

          if [[ "$PR_COUNT" -gt "$BASE_COUNT" ]]; then
            INCREASED_BY=$((PR_COUNT - BASE_COUNT))
            echo "❌ ERROR: The number of incomplete positions has increased by +$INCREASED_BY!"
            echo "  - Base: $BASE_COUNT"
            echo "  - PR: $PR_COUNT"
            echo "This pull request is supposed to **reduce** incomplete positions, but it has increased them instead."
            exit 1
          else
            echo "✅ Check passed! The number of incomplete positions has not increased."
          fi

      - name: Fail PR if script fails
        if: failure()
        run: exit 1

  check-alphabetic-sorting:
    name: Check for correct alphabetic sorting
    needs: autofix
    # Skipped when fixes were pushed, as the new run validates the fixed branch
    if: ${{ !cancelled() && needs.autofix.outputs.pushed != 'true' }}
    runs-on: macos-latest # So locales are space-sensitive
    steps:
      - name: Checkout Backend repository
        uses: actions/checkout@v3
        with:
          repository: digital-magic-club/vrtx-backend
          token: ${{ secrets.VRTX_CI_TOKEN }}
          ref: main
          path: backend

      - name: Checkout main branch
        uses: actions/checkout@v3
        with:
          ref: main
          path: main
          fetch-depth: 0

      - name: Fetch PR branch
        working-directory: main
        run: git fetch origin "+refs/pull/${{ github.event.pull_request.number }}/head:pr"

      - name: Stage dictionaries changed by the PR
        working-directory: main
        run: .github/scripts/stage_pr_dictionaries.sh pr "$GITHUB_WORKSPACE/pr_changed"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "$GITHUB_WORKSPACE/backend/functions/dictionaries/requirements.txt"

      - name: Run validation script
        run: |
          python "$GITHUB_WORKSPACE/backend/functions/dictionaries/check_alphabetic_sorting.py" "$GITHUB_WORKSPACE/pr_changed"

      - name: Fail PR if script fails
        if: failure()
        run: exit 1

  check-duplications:
    name: Check for duplicated lines
    needs: autofix
    # Skipped when fixes were pushed, as the new run validates the fixed branch
    if: ${{ !cancelled() && needs.autofix.outputs.pushed != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Backend repository
        uses: actions/checkout@v3
        with:
          repository: digital-magic-club/vrtx-backend
          token: ${{ secrets.VRTX_CI_TOKEN }}
          ref: main
          path: backend

      - name: Checkout main branch
        uses: actions/checkout@v3
        with:
          ref: main
          path: main
          fetch-depth: 0

      - name: Fetch PR branch
        working-directory: main
        run: git fetch origin "+refs/pull/${{ github.event.pull_request.number }}/head:pr"

      - name: Stage dictionaries changed by the PR
        working-directory: main
        run: .github/scripts/stage_pr_dictionaries.sh pr "$GITHUB_WORKSPACE/pr_changed"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "$GITHUB_WORKSPACE/backend/functions/dictionaries/requirements.txt"

      - name: Run validation script
        run: |
          python "$GITHUB_WORKSPACE/backend/functions/dictionaries/check_duplicates.py" "$GITHUB_WORKSPACE/pr_changed"

      - name: Fail PR if script fails
        if: failure()
        run: exit 1
