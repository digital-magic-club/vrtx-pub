name: Pull request validations

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [ master ]

# Every check only looks at the dictionaries changed by the PR, so an issue
# already on master (or in another PR) doesn't make unrelated PRs fail.
# The PR is fetched as data only: its files are read through git, never executed.

jobs:
  check-incomplete-positions:
    name: Check for incomplete positions delta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Backend repository
        uses: actions/checkout@v3
        with:
          repository: digital-magic-club/vrtx-backend
          token: ${{ secrets.VRTX_CI_TOKEN }}
          ref: master
          path: backend

      - name: Checkout master branch
        uses: actions/checkout@v3
        with:
          ref: master
          path: master
          fetch-depth: 0

      - name: Fetch PR branch
        working-directory: master
        run: git fetch origin "+refs/pull/${{ github.event.pull_request.number }}/head:pr"

      - name: Stage dictionaries changed by the PR
        working-directory: master
        run: |
          .github/scripts/stage_pr_dictionaries.sh base "$GITHUB_WORKSPACE/base_changed"
          .github/scripts/stage_pr_dictionaries.sh pr "$GITHUB_WORKSPACE/pr_changed"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "$GITHUB_WORKSPACE/backend/functions/dictionaries/requirements.txt"

      - name: Run validation script on base of changed dictionaries
        run: |
          python "$GITHUB_WORKSPACE/backend/functions/dictionaries/check_incomplete_positions.py" "$GITHUB_WORKSPACE/base_changed" > base_output.txt
          cat base_output.txt
          grep "Final total sum of incomplete positions" base_output.txt | awk '{print $NF}' > base_count.txt
          echo "BASE_COUNT=$(cat base_count.txt)" >> $GITHUB_ENV

      - name: Run validation script on PR changed dictionaries
        run: |
          python "$GITHUB_WORKSPACE/backend/functions/dictionaries/check_incomplete_positions.py" "$GITHUB_WORKSPACE/pr_changed" > pr_output.txt
          cat pr_output.txt
          grep "Final total sum of incomplete positions" pr_output.txt | awk '{print $NF}' > pr_count.txt
          echo "PR_COUNT=$(cat pr_count.txt)" >> $GITHUB_ENV

      - name: Compare Incomplete Positions
        run: |
          BASE_COUNT=${BASE_COUNT:-0}
          PR_COUNT=${PR_COUNT:-0}

          echo "Base incomplete positions in changed dictionaries: $BASE_COUNT"
          echo "PR incomplete positions in changed dictionaries: $PR_COUNT"

          if [[ "$PR_COUNT" -gt "$BASE_COUNT" ]]; then
            INCREASED_BY=$((PR_COUNT - BASE_COUNT))
            echo "❌ ERROR: The number of incomplete positions has increased by +$INCREASED_BY!"
            echo "  - Base: $BASE_COUNT"
            echo "  - PR: $PR_COUNT"
            echo "This pull request is supposed to **reduce** incomplete positions, but it has increased them instead."
            exit 1
          else
            echo "✅ Check passed! The number of incomplete positions has not increased."
          fi

      - name: Fail PR if script fails
        if: failure()
        run: exit 1

  check-alphabetic-sorting:
    name: Check for correct alphabetic sorting
    runs-on: macos-latest # So locales are space-sensitive
    steps:
      - name: Checkout Backend repository
        uses: actions/checkout@v3
        with:
          repository: digital-magic-club/vrtx-backend
          token: ${{ secrets.VRTX_CI_TOKEN }}
          ref: master
          path: backend

      - name: Checkout master branch
        uses: actions/checkout@v3
        with:
          ref: master
          path: master
          fetch-depth: 0

      - name: Fetch PR branch
        working-directory: master
        run: git fetch origin "+refs/pull/${{ github.event.pull_request.number }}/head:pr"

      - name: Stage dictionaries changed by the PR
        working-directory: master
        run: .github/scripts/stage_pr_dictionaries.sh pr "$GITHUB_WORKSPACE/pr_changed"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "$GITHUB_WORKSPACE/backend/functions/dictionaries/requirements.txt"

      - name: Run validation script
        run: |
          python "$GITHUB_WORKSPACE/backend/functions/dictionaries/check_alphabetic_sorting.py" "$GITHUB_WORKSPACE/pr_changed"

      - name: Fail PR if script fails
        if: failure()
        run: exit 1

  check-duplications:
    name: Check for duplicated lines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Backend repository
        uses: actions/checkout@v3
        with:
          repository: digital-magic-club/vrtx-backend
          token: ${{ secrets.VRTX_CI_TOKEN }}
          ref: master
          path: backend

      - name: Checkout master branch
        uses: actions/checkout@v3
        with:
          ref: master
          path: master
          fetch-depth: 0

      - name: Fetch PR branch
        working-directory: master
        run: git fetch origin "+refs/pull/${{ github.event.pull_request.number }}/head:pr"

      - name: Stage dictionaries changed by the PR
        working-directory: master
        run: .github/scripts/stage_pr_dictionaries.sh pr "$GITHUB_WORKSPACE/pr_changed"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "$GITHUB_WORKSPACE/backend/functions/dictionaries/requirements.txt"

      - name: Run validation script
        run: |
          python "$GITHUB_WORKSPACE/backend/functions/dictionaries/check_duplicates.py" "$GITHUB_WORKSPACE/pr_changed"

      - name: Fail PR if script fails
        if: failure()
        run: exit 1
